<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Jai Chawla's resume" />
    <title>Jai Chawla — Resume</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f4f4f4;
        color: #111;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid #d8d8d8;
        background: #fff;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      nav {
        display: flex;
        gap: 8px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid #c8c8c8;
        border-radius: 8px;
        color: #111;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        background: #f1f1f1;
      }

      a.primary {
        border-color: #111;
        background: #111;
        color: #fff;
      }

      a.primary:hover {
        background: #333;
      }

      main {
        min-height: 0;
        padding: 16px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid #d8d8d8;
        border-radius: 8px;
        background: #fff;
      }

      @media (max-width: 560px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Jai Chawla — Resume</h1>
      <nav aria-label="Resume actions">
        <a href="./Jai-Chawla-Resume.pdf" target="_blank" rel="noopener">Open PDF</a>
        <a class="primary" href="./Jai-Chawla-Resume.pdf" download>Download</a>
      </nav>
    </header>
    <main>
      <iframe src="./Jai-Chawla-Resume.pdf#view=FitH" title="Jai Chawla's resume">
        <p>
          Your browser cannot display the resume.
          <a href="./Jai-Chawla-Resume.pdf">Open the PDF instead.</a>
        </p>
      </iframe>
    </main>
  </body>
</html>
